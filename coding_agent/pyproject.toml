[project]
name = "coding-agent"
version = "0.3.0"
description = "从零手写的 Python Coding Agent，不依赖任何 Agent 框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "maladingda"},
]
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
nano-code = "agent:main"
coding-agent = "agent:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "agent_core", "changes", "command_runner", "exceptions", "execution_store", "model_api", "session_store", "tools", "windows_job", "workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
